# ============================================================
# GEOPOD v2 - podman-compose stack
# Target VPS 1 vCPU / 1 GB RAM / 20 GB disk
# Jalankan:  podman-compose up -d
# Port akses publik: 3433 (hindari konflik wslrelay yang mencuri 3333 via ::1)
# ============================================================
networks:
  geopod: {}

volumes:
  pgdata: {}
  geopod_cache: {}

services:
  # ---------- PostgreSQL + PostGIS ----------
  geodb:
    image: postgis/postgis:16-3.4-alpine
    container_name: geopod-geodb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geopod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geopod}
      POSTGRES_DB: ${POSTGRES_DB:-geopod_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    mem_limit: 400m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geopod} -d ${POSTGRES_DB:-geopod_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [geopod]

  # ---------- Vector Tile Server (Martin) ----------
  martin:
    image: ghcr.io/maplibre/martin:v0.16.0
    container_name: geopod-martin
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-geopod}:${POSTGRES_PASSWORD:-geopod}@geodb:5432/${POSTGRES_DB:-geopod_db}
    volumes:
      - ./deploy/martin/martin.yaml:/config/martin.yaml:ro
    command: ["--config", "/config/martin.yaml"]
    depends_on:
      geodb:
        condition: service_healthy
    networks: [geopod]

  # ---------- Backend API (binary Axum) ----------
  backend:
    build:
      context: ./backend
    image: geopod-backend:latest
    container_name: geopod-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-geopod}:${POSTGRES_PASSWORD:-geopod}@geodb:5432/${POSTGRES_DB:-geopod_db}
      BIND_ADDR: 0.0.0.0:3001
      RUST_LOG: ${RUST_LOG:-info}
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-ganti-ini-dengan-secret-panjang}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-ganti-ini}
      CACHE_DIR: /var/cache/nginx/geopod_cache
    volumes:
      - geopod_cache:/var/cache/nginx
    depends_on:
      geodb:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    networks: [geopod]

  # ---------- Reverse proxy + cache + rate limit ----------
  nginx:
    image: nginx:alpine
    container_name: geopod-nginx
    restart: unless-stopped
    depends_on:
      - martin
      - backend
    ports:
      - "3433:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - geopod_cache:/var/cache/nginx
    networks: [geopod]