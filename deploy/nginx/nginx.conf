# ============================================================
# GEOPOD v2 - Nginx Reverse Proxy & Cache Gateway
# - Static build Vite SPA (/usr/share/nginx/html)
# - Proxy API -> backend:3001 (Axum)
# - Proxy tiles -> martin:3000 (rewrite /tiles/ -> /kelurahan/)
# - Strict Rate Limiting (tiles 35r/s, api 7r/s, login 3r/m)
# - HTTP Proxy Cache 90 hari untuk /tiles/ dan /api/kelurahan/
# - Cache purge endpoint (backend) menghapus folder
#   /var/cache/nginx/geopod_cache (volume bersama)
# ============================================================

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # ---------- gzip ----------
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/vnd.mapbox-vector-tile;

    # ---------- RATE LIMITING ZONES ----------
    limit_req_zone  $binary_remote_addr zone=tiles_limit:10m  rate=35r/s;
    limit_req_zone  $binary_remote_addr zone=api_limit:10m   rate=7r/s;
    limit_req_zone  $binary_remote_addr zone=login_limit:10m rate=3r/m;
    limit_req_zone  $binary_remote_addr zone=basemap_limit:10m rate=25r/s;

    # ---------- HTTP PROXY CACHE ----------
    # Cache 90 hari untuk tile .pbf dan API Podes (GET/HEAD saja).
    proxy_cache_path /var/cache/nginx/geopod_cache
                     levels=1:2
                     keys_zone=geopod_cache:10m
                     inactive=90d
                     max_size=256m;
    proxy_cache_key "$scheme$request_method$uri";
    proxy_cache_valid 200 90d;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;

    # Non-GET/HEAD requests tidak boleh di-cache (perubahan/delete/auth).
    map $request_method $cache_bypass {
        default      1;
        GET          0;
        HEAD         0;
    }

    # ---------- SERVER ----------
    server {
        listen 80;
        server_name _;
        client_max_body_size 20m;

        # ===== Security headers =====
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # Blokir file mentah (anti-scraping / anti data leak).
        location ~* \.(geojson|json|kml|dbf|shp|shx)$ {
            deny all;
            return 403;
        }

        # ===== Auth login (brute-force guard) =====
        location = /api/auth/login {
            limit_req zone=login_limit burst=1 nodelay;
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api/auth/logout {
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== API atribut (proxy + cache GET 90 hari) =====
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_cache geopod_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $cache_bypass;
            proxy_no_cache $cache_bypass;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ===== Vector tiles Martin (rewrite /tiles/{z}/{x}/{y}.pbf -> /kelurahan/{z}/{x}/{y}) =====
        location /tiles/ {
            limit_req zone=tiles_limit burst=20 nodelay;
            rewrite ^/tiles/([0-9]+/[0-9]+/[0-9]+)(?:\.pbf)?$ /kelurahan/$1 break;
            proxy_pass http://martin:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache geopod_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $cache_bypass;
            proxy_no_cache $cache_bypass;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ===== Basemap (NONAKTIF - mode offline) =====
        # Basemap peta kini 100% lokal (GeoJSON konteks dari idn_admin4.shp +
        # poligon kelurahan via /tiles/); tidak ada tile eksternal sama sekali,
        # sehingga kebal dari watermark/API key/kebijakan penyedia.
        # Untuk mengaktifkan kembali tile raster, hapus tanda komentar blok ini.
        #location /basemap/ {
        #    limit_req zone=basemap_limit burst=25 nodelay;
        #    # OSM lama (memblokir IP datacenter dgn placeholder "Access blocked"):
        #    #   rewrite ^/basemap/(.*)$ /$1 break;
        #    #   proxy_pass https://tile.openstreetmap.org;
        #    #   proxy_set_header Host tile.openstreetmap.org;
        #    # CARTO (sejak 2026 wajib api key -> watermark "API key required",
        #    #   raster juga sedang di-retire):
        #    #   rewrite ^/basemap/(.*)$ /rastertiles/voyager/$1 break;
        #    #   proxy_pass https://basemaps.cartocdn.com;
        #    #   proxy_set_header Host basemaps.cartocdn.com;
        #    # Esri (alternatif tanpa key; urutan tile {z}/{y}/{x}):
        #    #   rewrite ^/basemap/([0-9]+)/([0-9]+)/([0-9]+)\.png$ /ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/$1/$3/$2 break;
        #    #   proxy_pass https://server.arcgisonline.com;
        #    #   proxy_set_header Host server.arcgisonline.com;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_set_header Referer "";
        #    proxy_intercept_errors on;
        #    error_page 400 403 404 429 500 502 503 504 =200 /assets/basemap-empty.png;
        #    proxy_cache geopod_cache;
        #    proxy_cache_methods GET HEAD;
        #    proxy_cache_bypass $cache_bypass;
        #    proxy_no_cache $cache_bypass;
        #    proxy_ignore_headers Cache-Control Expires;
        #    add_header X-Cache-Status $upstream_cache_status always;
        #}

        # ===== Basemap OSM standar + hillshade Esri (via proxy, anti-403) =====
        # Browser hanya meminta ke origin sendiri (/basemap/...); nginx yang
        # meneruskan ke penyedia dengan User-Agent resmi + cache 90 hari +
        # rate limit, sehingga kebal dari pemblokiran hotlink/CORS 403.
        # Catatan: Esri memakai urutan tile z/y/x (bukan z/x/y).
        location ~ ^/basemap/osm/([0-9]+)/([0-9]+)/([0-9]+)\.png$ {
            limit_req zone=basemap_limit burst=12 nodelay;
            rewrite ^/basemap/osm/(.*)$ /$1 break;
            proxy_pass https://tile.openstreetmap.org;
            proxy_set_header Host tile.openstreetmap.org;
            proxy_set_header User-Agent "GEOPOD-PagarAlam/2.0 (+https://www.openstreetmap.org/copyright)";
            proxy_set_header Referer "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 400 403 404 429 500 502 503 504 =200 /basemap-empty.png;
            proxy_cache geopod_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $cache_bypass;
            proxy_no_cache $cache_bypass;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location ~ ^/basemap/hillshade/([0-9]+)/([0-9]+)/([0-9]+)\.png$ {
            limit_req zone=basemap_limit burst=12 nodelay;
            rewrite ^/basemap/hillshade/([0-9]+)/([0-9]+)/([0-9]+)\.png$ /ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/$1/$3/$2 break;
            proxy_pass https://server.arcgisonline.com;
            proxy_set_header Host server.arcgisonline.com;
            proxy_set_header User-Agent "GEOPOD-PagarAlam/2.0";
            proxy_set_header Referer "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 400 403 404 429 500 502 503 504 =200 /basemap-empty.png;
            proxy_cache geopod_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $cache_bypass;
            proxy_no_cache $cache_bypass;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ===== Basemap Satelit Esri World Imagery (versi baru, via proxy anti-403) =====
        # Browser meminta /basemap/satellite/{z}/{x}/{y}.png; nginx meneruskan
        # ke Esri dengan urutan tile z/y/x + cache 90 hari + rate limit.
        location ~ ^/basemap/satellite/([0-9]+)/([0-9]+)/([0-9]+)\.png$ {
            limit_req zone=basemap_limit burst=12 nodelay;
            rewrite ^/basemap/satellite/([0-9]+)/([0-9]+)/([0-9]+)\.png$ /ArcGIS/rest/services/World_Imagery/MapServer/tile/$1/$3/$2 break;
            proxy_pass https://server.arcgisonline.com;
            proxy_set_header Host server.arcgisonline.com;
            proxy_set_header User-Agent "GEOPOD-PagarAlam/2.0";
            proxy_set_header Referer "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 400 403 404 429 500 502 503 504 =200 /basemap-empty.png;
            proxy_cache geopod_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $cache_bypass;
            proxy_no_cache $cache_bypass;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ===== Statik Vite SPA =====
        # ^~ agar menang atas regex deny di bawah (aset ber-ext geojson/json tetap boleh).
        location ^~ /assets/ {
            alias /usr/share/nginx/html/assets/;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            add_header Cache-Control "no-store";
            try_files $uri $uri/ /index.html;
        }
    }
}